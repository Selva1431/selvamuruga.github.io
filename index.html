<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>
</head>
<body>
  <p>Countdown Begins</p>
  <h2 class="pongal">Happy Pongal</h2>
  <div class="content">
    <div class="box">
        <h2 id="Days">00:</h2>
        <small>Days</small>
    </div>

    <div class="box">
        <h2 id="hours">00:</h2>
        <small>Hours</small>
    </div>

    <div class="box">
        <h2 id="minutes">00:</h2>
        <small>Minutes</small>
    </div>

    <div class="box">
        <h2 id="seconds">00</h2>
        <small>Seconds</small>
    </div>
  </div>

</body>
</html>
